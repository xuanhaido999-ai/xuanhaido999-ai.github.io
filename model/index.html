<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>雷州市第二中学 · 3D 校园模型</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@3.5.0/dist/model-viewer.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0e1620; overflow: hidden; }
  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  .bar {
    position: fixed; left: 0; right: 0; top: 0; z-index: 10;
    padding: 12px 16px; color: #fff; pointer-events: none;
    background: linear-gradient(180deg, rgba(6,16,28,.72), rgba(6,16,28,0));
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .bar h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  .bar p { margin: 4px 0 0; font-size: 12px; opacity: .75; }
  .hint {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 10;
    color: #dfe9f5; font-size: 12px; padding: 7px 14px; border-radius: 999px;
    background: rgba(10, 24, 40, .55); backdrop-filter: blur(6px);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; white-space: nowrap;
  }
</style>
</head>
<body>
<div class="bar">
  <h1>雷州市第二中学 · 3D 校园</h1>
  <p>Gemini 任务模式按卫星图＋实拍视频 1:1 米制建模 · 含西湖、图书馆、三元塔</p>
</div>
<model-viewer src="leizhou-no2.glb" camera-controls auto-rotate auto-rotate-delay="1200"
  rotation-per-second="12deg" shadow-intensity="0.7" exposure="1.05"
  camera-orbit="35deg 55deg 105%" min-camera-orbit="auto auto 30m" max-camera-orbit="auto auto 1600m"
  alt="雷州市第二中学三维校园模型"></model-viewer>
<div class="hint">单指拖动旋转 · 双指缩放 · 双击聚焦</div>
</body>
</html>
